# Publishes to npm when a GitHub release is published. Uses npm trusted publishing (OIDC), so no npm
# token is stored in this repository; each version carries provenance linking it to this workflow run.
# One-time setup on npmjs.com: package settings > Trusted publisher > GitHub Actions,
# repository realKeehan/sealform, workflow publish.yml.

name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm run check
      - name: Release tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; fi
      - run: npm publish --access public --provenance
